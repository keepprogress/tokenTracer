[package]
name = "tokentracer-bridge"
version = "0.1.0"
edition = "2021"
description = "tokenTracer Windows/WSL discovery bridge (AC-F1/F2 path probe POC)"
license = "MIT"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[[bin]]
name = "tokentracer-bridge"
path = "src/bin/tokentracer-bridge.rs"

[[example]]
name = "discover_fixtures"
path = "examples/discover_fixtures.rs"

[dev-dependencies]
tempfile = "3"
