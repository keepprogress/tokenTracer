[workspace]
resolver = "2"
members = ["crates/pricing", "apps/bridge", "apps/tokenTracer-host"]
# Host needs GUI/tray deps; default members keep Linux CI lean (pricing + bridge).
default-members = ["crates/pricing", "apps/bridge"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["getzch"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
anyhow = "1"
walkdir = "2"
globset = "=0.4.14"
