[workspace]
resolver = "2"
members = ["crates/pricing"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["getzch"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
anyhow = "1"
